<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/594a9a3356.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/storybook.css">
    <title>Burger Button Component</title>
</head>
<body>
    <div class="burger-title">Burger button in navbar</div>
    <div class="burger-title burger-title--info">Not displayed from 992px resolution</div>
    <nav>
        <button class="burger-btn">
            <i class="burger-btn__bars fa-solid fa-bars"></i>
        </button>
    </nav>

    <div class="burger-title">Burger button in header</div>
    <header>
        <button class="burger-btn">
            <i class="burger-btn__bars fa-solid fa-bars"></i>
        </button>
    </header>
</body>
</html>
