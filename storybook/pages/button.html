<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/594a9a3356.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/storybook.css">
    <title>Button Component</title>
</head>
<body>
    <span class="title">Standalone</span>
    <button class="button">
        Add New 
        <i class="button__icon fa-solid fa-caret-down"></i>
    </button>

    <span class="title">Navbar context</span>
    <nav>
        <button class="button">
            Add New 
            <i class="button__icon fa-solid fa-caret-down"></i>
        </button>
    </nav>
    <span class="title">Form context</span>
    <form>
        <button class="button">
            Add New 
            <i class="button__icon fa-solid fa-caret-down"></i>
        </button>
    </form>
    <span class="title">Div context</span>
    <div>
        <button class="button">
            Add New 
            <i class="button__icon fa-solid fa-caret-down"></i>
        </button>
    </div>
</body>
</html>
