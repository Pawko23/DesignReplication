<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/storybook.css">
    <title>Avatar Link Component</title>
</head>
<body>
    <div class="title">Avatar Profile Picture Link</div>
    <a href="#" class="avatar-link">
        <img src="../assets/logo-color.svg" alt="" class="avatar-link__img avatar-link__img--profile">
    </a>

    <div class="title">Avatar Logo</div>
    <a href="#" class="avatar-link">
        <img src="../assets/logo-color.svg" alt="" class="avatar-link__img avatar-link__img--logo">
    </a>

    <div class="title">Avatar Logo with badge</div>
    <a href="#" class="avatar-link">
        <img src="../assets/logo-color.svg" alt="" class="avatar-link__img avatar-link__img--logo">
        <span class="avatar-link__badge">1.3.0</span>
    </a>
</body>
</html>
