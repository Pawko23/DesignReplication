<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/storybook.css">
    <title>Section Box Component</title>
</head>
<body>
    <div>Single, default image box</div>
    <div class="wrapper">
            <div class="section-box">
                <img src="../assets/nav-side-user.png" alt="" class="section-box__img section-box__img--active">
                <img src="../assets/nav-side-chat.png" alt="" class="section-box__img">
                <img src="../assets/nav-side-kanban-board.png" alt="" class="section-box__img">
                <img src="../assets/nav-side-team.png" alt="" class="section-box__img">
            </div>
        </div>
    </div>
    <div>Multiple small image boxes</div>
    <div class="wrapper wrapper--row">
        <div class="section-box section-box--small">
            <img src="../assets/nav-side-user.png" alt="" class="section-box__img section-box__img--active">
            <img src="../assets/nav-side-chat.png" alt="" class="section-box__img">
            <img src="../assets/nav-side-kanban-board.png" alt="" class="section-box__img">
            <img src="../assets/nav-side-team.png" alt="" class="section-box__img">
        </div>
        <div class="section-box section-box--small">
            <img src="../assets/nav-side-user.png" alt="" class="section-box__img section-box__img--active">
            <img src="../assets/nav-side-chat.png" alt="" class="section-box__img">
            <img src="../assets/nav-side-kanban-board.png" alt="" class="section-box__img">
            <img src="../assets/nav-side-team.png" alt="" class="section-box__img">
        </div>
    </div>
    <div>Layouts components image boxes</div>
    <div class="wrapper wrapper--row">
        <div class="section-box section-box--layout">
            <img src="../assets/layout-nav-side.svg" alt="" class="section-box__img section-box__img--active">
        </div>
        <div class="section-box section-box--layout">
            <img src="../assets/layout-nav-top-sidebar.svg" alt="" class="section-box__img section-box__img--active">
        </div>
        <div class="section-box section-box--layout">
            <img src="../assets/layout-nav-top.svg" alt="" class="section-box__img section-box__img--rounded section-box__img--active">
        </div>
    </div>
    <div>Square image boxes</div>
    <div class="wrapper wrapper--row">
        <div class="section-box section-box--square">
            <img src="../assets/layout-nav-side.svg" alt="" class="section-box__img section-box__img--active">
        </div>
        <div class="section-box section-box--square">
            <img src="../assets/layout-nav-top-sidebar.svg" alt="" class="section-box__img section-box__img--active">
        </div>
        <div class="section-box section-box--square">
            <img src="../assets/layout-nav-top.svg" alt="" class="section-box__img section-box__img--active">
        </div>
        <div class="section-box section-box--square">
            <img src="../assets/layout-nav-top.svg" alt="" class="section-box__img section-box__img--active">
        </div>
    </div>
</div>
    <script src="../js/section-box.js"></script>
</body>
</html>
